{% extends "base.html" %}

{% block title %}首頁 - 任務管理系統{% endblock %}

{% block content %}
<div class="p-5 mb-4 bg-light rounded-3">
    <div class="container-fluid py-5">
        <h1 class="display-5 fw-bold">歡迎使用任務管理系統</h1>
        <p class="col-md-8 fs-4">這是一個簡單且高效的任務管理工具，幫助您追蹤日常工作進度。</p>
        <hr class="my-4">
        <p>點擊下方按鈕開始管理您的任務。</p>
        <a href="{{ url_for('task.index') }}" class="btn btn-primary btn-lg" type="button">查看任務列表</a>
    </div>
</div>

<div class="row align-items-md-stretch">
    <div class="col-md-6">
        <div class="h-100 p-5 text-white bg-dark rounded-3">
            <h2>快速新增</h2>
            <p>隨時隨地紀錄您的新想法與任務。</p>
            <a href="{{ url_for('task.create') }}" class="btn btn-outline-light">新增任務</a>
        </div>
    </div>
    <div class="col-md-6">
        <div class="h-100 p-5 bg-light border rounded-3">
            <h2>系統說明</h2>
            <p>本系統採用 Flask 開發，支援任務的新增、修改、刪除與狀態追蹤。</p>
            <button class="btn btn-outline-secondary" type="button">了解更多</button>
        </div>
    </div>
</div>
{% endblock %}
